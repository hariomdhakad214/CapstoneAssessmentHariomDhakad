name: Terraform GitOps

on:
  pull_request:
    branches:
      - main
    paths:
      - "project18/**"
  push:
    branches:
      - main
    paths:
      - "project18/**"

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=project18 init -input=false

      - name: Terraform Plan
        run: terraform -chdir=project18 plan -input=false -out=tfplan

      - name: Show plan in the run summary
        run: |
          echo '### Terraform plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=project18 show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: project18/tfplan

  # Runs only after a PR is merged into main. Opens an issue and waits for the approver to comment "approved".
  approve:
    name: Approve Apply
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write

    steps:
      - name: Wait for manual approval
        uses: trstringer/manual-approval@v1.13.1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: hariomdhakad214
          minimum-approvals: 1
          issue-title: "Approve Terraform apply for commit ${{ github.sha }}"
          issue-body: "Review the plan in the workflow run summary, then comment `approved` to run the apply or `denied` to cancel it."

  apply:
    name: Terraform Apply
    needs: approve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: project18

      - name: Terraform Init
        run: terraform -chdir=project18 init -input=false

      - name: Terraform Apply
        run: terraform -chdir=project18 apply -input=false tfplan

      - name: Show release manifest
        run: cat project18/release.txt
